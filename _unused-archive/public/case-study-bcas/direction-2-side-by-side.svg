<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Wireframe of direction two: the assessment and the reviewer's observations placed side by side, with the second panel running past the edge of a typical laptop viewport.">
  <style>
    .f  { fill: none; stroke: #94a3b8; stroke-opacity: .45 }
    .fd { fill: none; stroke: #94a3b8; stroke-opacity: .5; stroke-dasharray: 5 5 }
    .b  { fill: #94a3b8; fill-opacity: .14 }
    .l  { fill: #94a3b8; fill-opacity: .3 }
    .lf { fill: #94a3b8; fill-opacity: .16 }
    .t  { fill: #94a3b8; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    .tk { fill: #94a3b8; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .14em }
    .tw { fill: #38bdf8; font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    .aw { fill: none; stroke: #38bdf8; stroke-opacity: .9; stroke-dasharray: 6 4 }
  </style>

  <rect class="f" x="24" y="24" width="752" height="372" rx="14"/>
  <text class="tk" x="48" y="56">DIRECTION 02</text>
  <text class="t" x="48" y="78">Side by side assessment and review</text>

  <!-- panel A: the assessment -->
  <rect class="f" x="48" y="104" width="300" height="252" rx="8"/>
  <rect class="b" x="48" y="104" width="300" height="26" rx="8"/>
  <rect class="l" x="64" y="113" width="88" height="8" rx="4"/>
  <rect class="l" x="66" y="152" width="262" height="7" rx="3.5"/>
  <rect class="l" x="66" y="168" width="212" height="7" rx="3.5"/>
  <rect class="lf" x="66" y="192" width="262" height="46" rx="6"/>
  <rect class="l" x="66" y="256" width="248" height="7" rx="3.5"/>
  <rect class="l" x="66" y="272" width="188" height="7" rx="3.5"/>
  <rect class="lf" x="66" y="296" width="262" height="46" rx="6"/>
  <text class="t" x="48" y="378">the entity's reply</text>

  <!-- panel B: the review, running past the viewport -->
  <rect class="f" x="368" y="104" width="360" height="252" rx="8"/>
  <rect class="b" x="368" y="104" width="360" height="26" rx="8"/>
  <rect class="l" x="384" y="113" width="104" height="8" rx="4"/>
  <rect class="l" x="386" y="152" width="316" height="7" rx="3.5"/>
  <rect class="l" x="386" y="168" width="264" height="7" rx="3.5"/>
  <rect class="lf" x="386" y="192" width="316" height="46" rx="6"/>
  <rect class="l" x="386" y="256" width="300" height="7" rx="3.5"/>
  <rect class="l" x="386" y="272" width="238" height="7" rx="3.5"/>
  <rect class="lf" x="386" y="296" width="316" height="46" rx="6"/>
  <text class="t" x="368" y="378">the director's observation</text>

  <!-- the real laptop viewport, narrower than the layout needs -->
  <path class="aw" d="M636 84 V392"/>
  <text class="tw" x="632" y="76" text-anchor="end">laptop viewport ends here</text>
</svg>
