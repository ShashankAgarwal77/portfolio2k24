<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-label="Wireframe of the shipped direction: an Observations lifecycle stage with a list of observations on the left, each carrying its own regulation reference, and the conversation trail plus response composer docked on the right.">
  <style>
    .f  { fill: none; stroke: #94a3b8; stroke-opacity: .45 }
    .b  { fill: #94a3b8; fill-opacity: .14 }
    .l  { fill: #94a3b8; fill-opacity: .3 }
    .lf { fill: #94a3b8; fill-opacity: .16 }
    .t  { fill: #94a3b8; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    .tk { fill: #38bdf8; font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: .14em }
    .th { fill: #94a3b8; font: 400 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    .ts { fill: #38bdf8; font: 400 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
    .as { fill: none; stroke: #38bdf8; stroke-opacity: .9 }
    .ab { fill: #38bdf8; fill-opacity: .12 }
    .ad { fill: #38bdf8; fill-opacity: .85 }
  </style>

  <rect class="as" x="24" y="24" width="752" height="372" rx="14"/>
  <text class="tk" x="48" y="56">DIRECTION 03 · SHIPPED</text>
  <text class="t" x="48" y="78">A docked observation workspace</text>

  <!-- lifecycle stages, Observations active -->
  <g>
    <rect class="lf" x="48" y="96" width="118" height="24" rx="12"/>
    <rect class="lf" x="174" y="96" width="118" height="24" rx="12"/>
    <rect class="lf" x="300" y="96" width="118" height="24" rx="12"/>
    <rect class="ab" x="426" y="96" width="146" height="24" rx="12"/>
    <rect class="as" x="426" y="96" width="146" height="24" rx="12"/>
    <text class="ts" x="452" y="112">Observations</text>
    <rect class="lf" x="580" y="96" width="118" height="24" rx="12"/>
  </g>

  <!-- left: the observation list -->
  <rect class="f" x="48" y="140" width="326" height="216" rx="8"/>

  <!-- expanded row, carrying its own rule reference -->
  <rect class="ab" x="60" y="152" width="302" height="88" rx="6"/>
  <rect class="as" x="60" y="152" width="302" height="88" rx="6"/>
  <rect class="l" x="74" y="166" width="120" height="8" rx="4"/>
  <rect class="ad" x="252" y="163" width="96" height="14" rx="7"/>
  <rect class="l" x="74" y="190" width="268" height="6" rx="3"/>
  <rect class="l" x="74" y="204" width="212" height="6" rx="3"/>
  <path class="as" d="M74 222 H196"/>
  <text class="ts" x="74" y="234">NCASP Sec 8.6.1</text>

  <!-- collapsed rows with status chips -->
  <g>
    <rect class="lf" x="60" y="252" width="302" height="30" rx="6"/>
    <rect class="l" x="74" y="263" width="132" height="8" rx="4"/>
    <rect class="l" x="266" y="262" width="82" height="11" rx="5.5"/>
  </g>
  <g>
    <rect class="lf" x="60" y="290" width="302" height="30" rx="6"/>
    <rect class="l" x="74" y="301" width="150" height="8" rx="4"/>
    <rect class="l" x="266" y="300" width="82" height="11" rx="5.5"/>
  </g>
  <g>
    <rect class="lf" x="60" y="328" width="302" height="18" rx="6"/>
  </g>

  <!-- right: the docked conversation and composer -->
  <rect class="f" x="394" y="140" width="334" height="216" rx="8"/>
  <rect class="l" x="410" y="156" width="118" height="8" rx="4"/>

  <rect class="lf" x="410" y="180" width="240" height="44" rx="6"/>
  <rect class="l" x="424" y="194" width="188" height="6" rx="3"/>
  <rect class="l" x="424" y="206" width="140" height="6" rx="3"/>

  <rect class="ab" x="472" y="234" width="240" height="44" rx="6"/>
  <rect class="l" x="486" y="248" width="188" height="6" rx="3"/>
  <rect class="l" x="486" y="260" width="152" height="6" rx="3"/>

  <rect class="as" x="410" y="292" width="302" height="48" rx="6"/>
  <text class="ts" x="424" y="313">your response</text>
  <rect class="ad" x="640" y="304" width="58" height="20" rx="10"/>

  <!-- the persistent count -->
  <path class="f" d="M48 372 H728"/>
  <text class="t" x="48" y="390">3 observations still need your response</text>
</svg>
